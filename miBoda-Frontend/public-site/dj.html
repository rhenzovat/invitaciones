<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Canciones sugeridas — Renzo &amp; Yakelin</title>
<style>
  :root {
    --color-dorado: #A16207;
    --color-terracota: #C57B57;
    --bg: #14100e;
    --card: #211a16;
    --text: #f3e9df;
    --text-dim: #b8a99b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 1.25rem 1rem 3rem;
  }
  header {
    text-align: center;
    margin-bottom: 1.5rem;
  }
  header h1 {
    font-size: 1.4rem;
    margin: 0 0 0.25rem;
    color: var(--color-dorado);
  }
  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  .estado {
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 1rem;
  }
  .estado.error { color: #e07a5f; }
  ul.lista {
    list-style: none;
    margin: 0 auto;
    padding: 0;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  li.item {
    background: var(--card);
    border: 1px solid rgba(161, 98, 7, 0.25);
    border-radius: 12px;
    padding: 0.85rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }
  .puesto {
    flex: 0 0 auto;
    width: 2.1rem;
    height: 2.1rem;
    border-radius: 50%;
    background: var(--color-dorado);
    color: #1a1310;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
  }
  li.item:nth-child(1) .puesto { background: #f1c40f; }
  li.item:nth-child(2) .puesto { background: #cfd8dc; }
  li.item:nth-child(3) .puesto { background: var(--color-terracota); }
  .info { flex: 1 1 auto; min-width: 0; }
  .nombre {
    font-weight: 600;
    font-size: 1.02rem;
    line-height: 1.3;
    word-break: break-word;
  }
  .meta {
    margin-top: 0.15rem;
    font-size: 0.8rem;
    color: var(--text-dim);
  }
  .pedido-por {
    margin-top: 0.3rem;
    font-size: 0.75rem;
    color: var(--color-terracota);
    word-break: break-word;
  }
  .veces {
    flex: 0 0 auto;
    text-align: center;
    font-weight: 700;
    color: var(--color-dorado);
    font-size: 1.1rem;
    min-width: 2.4rem;
  }
  .veces small {
    display: block;
    font-weight: 400;
    font-size: 0.65rem;
    color: var(--text-dim);
  }
  .vacio {
    text-align: center;
    color: var(--text-dim);
    margin-top: 3rem;
    font-size: 0.95rem;
  }
</style>
</head>
<body>
  <header>
    <h1>🎧 Canciones sugeridas</h1>
    <p>Renzo &amp; Yakelin — lista en vivo, ordenada por las mas pedidas</p>
  </header>
  <div class="estado" id="estado">Cargando...</div>
  <ul class="lista" id="lista"></ul>

  <script>
    const API_URL = "/api/miboda/dj/canciones";
    const REFRESH_MS = 15000;

    const $lista = document.getElementById("lista");
    const $estado = document.getElementById("estado");

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function render(items) {
      const vacioPrevio = document.getElementById("vacio-msg");
      if (vacioPrevio) vacioPrevio.remove();

      if (!items.length) {
        $lista.innerHTML = "";
        $lista.insertAdjacentHTML(
          "afterend",
          '<p class="vacio" id="vacio-msg">Todavia no hay canciones sugeridas.</p>'
        );
        return;
      }

      $lista.innerHTML = items
        .map((it, i) => {
          const pedidoPor = Array.isArray(it.pedidoPor) ? it.pedidoPor : [];
          return `
          <li class="item">
            <div class="puesto">${i + 1}</div>
            <div class="info">
              <div class="nombre">${escapeHtml(it.cancion)}</div>
              <div class="meta">${escapeHtml(it.genero || "")}</div>
              ${pedidoPor.length ? `<div class="pedido-por">Pedido por: ${escapeHtml(pedidoPor.join(", "))}</div>` : ""}
            </div>
            <div class="veces">${it.veces}<small>${it.veces === 1 ? "pedido" : "pedidos"}</small></div>
          </li>
        `;
        })
        .join("");
    }

    async function cargar() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        render(Array.isArray(data) ? data : []);
        const ahora = new Date().toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" });
        $estado.classList.remove("error");
        $estado.textContent = "Actualizado " + ahora;
      } catch (err) {
        $estado.classList.add("error");
        $estado.textContent = "No se pudo actualizar (reintentando...)";
      }
    }

    cargar();
    setInterval(cargar, REFRESH_MS);
  </script>
</body>
</html>
